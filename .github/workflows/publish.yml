name: News and weather dashboard deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fire7-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Fetch BBC Japanese RSS headlines
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import html
          import datetime
          import urllib.request
          import xml.etree.ElementTree as ET

          feed = 'https://feeds.bbci.co.uk/japanese/rss.xml'
          req = urllib.request.Request(feed, headers={'User-Agent': 'Mozilla/5.0 (Fire7-Weather personal RSS reader)'})
          with urllib.request.urlopen(req, timeout=30) as response:
              source = response.read()
          root = ET.fromstring(source)
          items = []
          for entry in root.findall('.//item'):
              title = html.unescape((entry.findtext('title') or '').strip())
              url = (entry.findtext('link') or '').strip()
              if title and url.startswith('https://'):
                  items.append({'title': title[:250], 'url': url})
              if len(items) >= 10:
                  break
          if not items:
              raise RuntimeError('The BBC Japanese RSS feed returned no usable headlines')
          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          with open('news.json', 'w', encoding='utf-8') as out:
              json.dump({'updated_at': now, 'items': items}, out, ensure_ascii=False)
          print('Fetched', len(items), 'news headlines')
          PY

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html news.json _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
