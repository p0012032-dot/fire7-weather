<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>荒牧の天気 | Kindle 時計重視版</title>
<style type="text/css">
/* 2014 Kindle Basic (WP63GW) / older WebKit. No Grid, no remote fonts. */
*{-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#111;overflow:hidden;font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
#viewport{position:relative;width:540px;height:660px;overflow:visible}
#screen{position:absolute;left:0;top:0;width:660px;height:540px;overflow:hidden;background:#fff;-webkit-transform-origin:0 0;transform-origin:0 0;-webkit-transform:translate(540px,0) rotate(90deg);transform:translate(540px,0) rotate(90deg)}
.card{border:2px solid #1f1f1f;border-radius:9px;background:#fff;overflow:hidden}
#left{position:absolute;left:10px;top:10px;width:181px;height:520px;padding:13px 11px}
#place{font-weight:bold;font-size:22px;line-height:27px;white-space:nowrap}
#date{font-weight:bold;font-size:17px;line-height:25px;margin-top:4px}
#clock{font-family:Arial,sans-serif;font-weight:bold;font-size:52px;line-height:68px;letter-spacing:-2px;white-space:nowrap;color:#000;margin:9px -2px 0}
#big-now{height:93px;margin:13px -2px 0;white-space:nowrap;text-align:center}
#current-icon{display:inline-block;vertical-align:middle;width:70px;height:67px;line-height:67px}
#current-icon svg{width:66px;height:66px}
#current-temp{display:inline-block;vertical-align:middle;font-size:49px;font-weight:bold;line-height:70px;letter-spacing:-2px}
#stats{font-size:17px;font-weight:bold;line-height:34px;margin-top:1px}
#rain-box{border-top:2px solid #111;margin-top:12px;padding-top:10px;font-size:17px;line-height:27px;font-weight:bold;overflow-wrap:break-word;word-break:normal}
#left-bottom{position:absolute;bottom:12px;left:11px;right:9px;font-size:11px;font-weight:bold;color:#555;line-height:17px}
#right{position:absolute;left:201px;top:10px;width:449px;height:520px}
.panel{position:relative;width:449px}
#today{height:205px}
#tomorrow{height:198px;margin-top:9px}
#three{height:99px;margin-top:9px}
.panel-head{height:38px;border-bottom:2px solid #222;white-space:nowrap;position:relative;padding:2px 8px}
.panel-head .tag{display:inline-block;background:#111;color:#fff;border-radius:5px;padding:3px 10px;font-size:20px;font-weight:bold;line-height:28px}
.panel-head .subtitle{position:absolute;right:9px;top:9px;font-size:14px;font-weight:bold;white-space:nowrap}
#today-slots,#tomorrow-slots{font-size:0;white-space:nowrap;padding:4px 5px 0;height:162px}
#tomorrow-slots{height:156px}
.slot{display:inline-block;vertical-align:top;text-align:center;height:150px;border-left:1px solid #777;white-space:normal;color:#161616}
.slot:first-child{border-left:0}
.slot.past{color:#555}
.slot-hour{font-size:17px;font-weight:bold;line-height:22px;height:23px}
.slot-icon{height:38px;line-height:38px}
.slot-icon svg{width:37px;height:37px}
.slot-temp{font-size:27px;font-weight:bold;line-height:32px}
.slot-prob{font-size:17px;font-weight:bold;line-height:22px}
.slot-mm{font-size:14px;font-weight:bold;line-height:19px}
#today-slots.dense .slot-hour{font-size:15px}
#today-slots.dense .slot-temp{font-size:23px}
#today-slots.dense .slot-prob{font-size:15px}
#today-slots.dense .slot-mm{font-size:12px}
#today-slots.dense .slot-icon svg{width:29px;height:35px}
#today-slots.dense .slot-icon{height:35px}
#tomorrow .slot{height:148px}
#tomorrow .slot-hour{font-size:20px;line-height:25px;height:27px}
#tomorrow .slot-icon{height:47px}
#tomorrow .slot-icon svg{width:47px;height:47px}
#tomorrow .slot-temp{font-size:31px;line-height:35px}
#tomorrow .slot-prob{font-size:19px;line-height:23px}
#tomorrow .slot-mm{font-size:16px;line-height:20px}
#three .panel-head{height:33px;padding-left:10px;line-height:29px;font-size:19px;font-weight:bold}
#three-days{height:63px;white-space:nowrap;font-size:0;padding:1px 3px 0}
.day{width:33.333%;display:inline-block;vertical-align:top;height:61px;text-align:center;border-left:1px solid #777;white-space:normal}
.day:first-child{border-left:0}
.day-date{font-size:17px;font-weight:bold;line-height:21px;white-space:nowrap}
.day-prob{font-size:16px;font-weight:bold;line-height:22px;white-space:nowrap}
.day-hi{font-size:12px;line-height:15px;color:#333;font-weight:bold}
svg{display:inline-block;fill:none;stroke:#111;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="viewport"><div id="screen">
  <div id="left" class="card">
    <div id="place">荒牧の天気</div>
    <div id="date">日付を確認中</div>
    <div id="clock">--:--</div>
    <div id="big-now"><span id="current-icon">☁</span><span id="current-temp">--℃</span></div>
    <div id="stats">体感 <span id="feels">--℃</span><br>湿度 <span id="humidity">--%</span><br>風 <span id="wind">--m/s</span></div>
    <div id="rain-box">☂ <span id="rain-note">天気を取得中</span></div>
    <div id="left-bottom">Open-Meteo / 30分更新<br>雨量＝時間帯の最大1時間値<br><span id="last-update">データ取得待ち</span></div>
  </div>
  <div id="right">
    <div id="today" class="panel card"><div class="panel-head"><span class="tag">今日</span><span class="subtitle" id="today-label">3時間ごと</span></div><div id="today-slots"></div></div>
    <div id="tomorrow" class="panel card"><div class="panel-head"><span class="tag">明日</span><span class="subtitle">6時間ごと / 雨量は最大1時間値</span></div><div id="tomorrow-slots"></div></div>
    <div id="three" class="panel card"><div class="panel-head">3日間予報 <span class="subtitle">午前 / 午後</span></div><div id="three-days"></div></div>
  </div>
</div></div>
<script type="text/javascript">
(function(){
'use strict';
// Same approximate Aramaki location as the previous Fire 7 / Kindle dashboard.
var LAT=34.8107,LON=135.3825;
var WEEK=['日','月','火','水','木','金','土'];
var URL='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+
 '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m,weather_code,is_day'+
 '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day'+
 '&daily=temperature_2m_max,temperature_2m_min,weather_code'+
 '&timezone=Asia%2FTokyo&forecast_days=6&wind_speed_unit=ms';
function el(id){return document.getElementById(id)}
function put(id,val){var e=el(id);if(e)e.innerHTML=String(val)}
function pad(n){return n<10?'0'+n:String(n)}
function jst(){return new Date((new Date()).getTime()+9*3600000)}
function dayKey(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addDays(d,n){return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+n))}
function round(v){return typeof v==='number'&&isFinite(v)?Math.round(v):'--'}
function prob(v){return typeof v==='number'&&isFinite(v)?Math.round(v)+'%':'--%'}
function amount(v){return typeof v==='number'&&isFinite(v)?(v<0.05?'0.0':v.toFixed(1)):'--'}
function icon(c,day){
 var a='<svg viewBox="0 0 64 64" aria-hidden="true">',cl='<path d="M14 48h34a10 10 0 0 0 0-20 17 17 0 0 0-31 3A9 9 0 0 0 14 48Z"/>';
 if(c===0)return a+(day?'<circle cx="32" cy="32" r="11"/><path d="M32 4v9M32 51v9M4 32h9M51 32h9M12 12l7 7M45 45l7 7M52 12l-7 7M19 45l-7 7"/>':'<path d="M44 11A22 22 0 1 0 54 45 22 22 0 0 1 44 11Z"/>')+'</svg>';
 if(c===1||c===2)return a+'<circle cx="24" cy="20" r="10"/>'+cl+'</svg>';
 if((c>=51&&c<=67)||(c>=80&&c<=82)||c>=95)return a+cl+'<path d="M20 53l-3 7M33 53l-3 7M46 53l-3 7"/></svg>';
 if((c>=71&&c<=77)||(c>=85&&c<=86))return a+cl+'<path d="M19 55h8m-4-4v8M35 55h8m-4-4v8"/></svg>';
 return a+cl+'</svg>';
}
// Open-Meteo hourly precipitation is the accumulation for the previous hour;
// (start, start+hours] captures exactly the requested period.
function keyHour(day,hour){var d=new Date(Date.UTC(parseInt(day.substring(0,4),10),parseInt(day.substring(5,7),10)-1,parseInt(day.substring(8,10),10),hour));return dayKey(d)+'T'+pad(d.getUTCHours())}
function indexHour(h,day,hour){var stamp=keyHour(day,hour);for(var i=0;i<h.time.length;i++)if(h.time[i].substring(0,13)===stamp)return i;return -1}
function maxIn(h,day,start,count,field){
 if(!h||!h.time||!h[field])return null;
 var from=keyHour(day,start),to=keyHour(day,start+count),best=null,found=0;
 for(var i=0;i<h.time.length;i++){
  var t=h.time[i].substring(0,13);if(t<=from||t>to)continue;
  var v=h[field][i];if(typeof v==='number'&&isFinite(v)){if(best===null||v>best)best=v;found++}
 }
 return found===count?best:null;
}
function slot(h,day,hour,duration,past){
 var k=indexHour(h,day,hour),code=k>=0?h.weather_code[k]:null;
 var html='<div class="slot'+(past?' past':'')+'"><div class="slot-hour">'+hour+'時</div>';
 html+='<div class="slot-icon">'+(k<0?'--':icon(code,h.is_day[k]===1))+'</div>';
 html+='<div class="slot-temp">'+(k<0?'--':round(h.temperature_2m[k]))+'°</div>';
 html+='<div class="slot-prob">☂'+prob(maxIn(h,day,hour,duration,'precipitation_probability'))+'</div>';
 html+='<div class="slot-mm">'+amount(maxIn(h,day,hour,duration,'precipitation'))+'mm</div></div>';
 return html;
}
function dailyIndex(d,key){for(var i=0;i<d.time.length;i++)if(d.time[i]===key)return i;return -1}
function rainText(c){if(c===0)return '晴れ';if(c<=2)return '晴れ時々曇り';if(c===3)return '曇り';if(c>=51&&c<=67||c>=80&&c<=82)return '雨';if(c>=71&&c<=77||c>=85&&c<=86)return '雪';if(c>=95)return '雷雨';return '天気不明'}
function render(data){
 if(!data||!data.current||!data.hourly||!data.daily||!data.hourly.time||!data.daily.time)throw new Error('weather data incomplete');
 var now=jst(),today=dayKey(now),tomorrow=dayKey(addDays(now,1)),c=data.current,h=data.hourly,d=data.daily;
 put('current-icon',icon(c.weather_code,c.is_day===1));put('current-temp',round(c.temperature_2m)+'°');
 put('feels',round(c.apparent_temperature)+'℃');put('humidity',prob(c.relative_humidity_2m));
 var dirs=['北','北東','東','南東','南','南西','西','北西'];
 var wd=typeof c.wind_direction_10m==='number'?dirs[Math.round(c.wind_direction_10m/45)%8]:'--';
 put('wind',wd+' '+(typeof c.wind_speed_10m==='number'?c.wind_speed_10m.toFixed(1):'--')+'m/s');
 // The chosen B layout focuses on upcoming hours. Show up to 8 on very early mornings;
 // after 06:00 it uses the six large 3-hour columns from the approved design.
 var start=now.getUTCHours()<6?Math.floor(now.getUTCHours()/3)*3:6;
 var count=(24-start)/3,items='',i,hr;
 for(hr=start;hr<=21;hr+=3)items+=slot(h,today,hr,3,hr+3<=now.getUTCHours());
 var tSlots=el('today-slots');tSlots.className=count>6?'dense':'';tSlots.innerHTML=items;
 var width=(100/count)+'%';for(i=0;i<tSlots.children.length;i++)tSlots.children[i].style.width=width;
 put('today-label','3時間ごと ・ '+start+'〜24時');
 items='';for(hr=0;hr<=18;hr+=6)items+=slot(h,tomorrow,hr,6,false);
 var nSlots=el('tomorrow-slots');nSlots.innerHTML=items;
 for(i=0;i<nSlots.children.length;i++)nSlots.children[i].style.width='25%';
 items='';for(i=2;i<=4;i++){
  var dt=addDays(now,i),key=dayKey(dt),di=dailyIndex(d,key),am=maxIn(h,key,0,12,'precipitation_probability'),pm=maxIn(h,key,12,12,'precipitation_probability');
  var hi=di<0?'--':round(d.temperature_2m_max[di]),lo=di<0?'--':round(d.temperature_2m_min[di]);
  items+='<div class="day"><div class="day-date">'+WEEK[dt.getUTCDay()]+' '+(dt.getUTCMonth()+1)+'/'+dt.getUTCDate()+'</div>'+
  '<div class="day-prob">☂'+prob(am)+' / '+prob(pm)+'</div><div class="day-hi">最高'+hi+'° / 最低'+lo+'°</div></div>';
 }
 put('three-days',items);
 var firstRain=null,from=keyHour(today,now.getUTCHours()),to=keyHour(today,now.getUTCHours()+48);
 for(i=0;i<h.time.length;i++){
  var t=h.time[i].substring(0,13),v=h.precipitation[i],pr=h.precipitation_probability[i];
  if(t<from||t>to)continue;
  if(typeof v==='number'&&v>=0.2&&typeof pr==='number'&&pr>=40){firstRain=t;break}
 }
 if(firstRain){var label=firstRain.substring(0,10)===today?'今日':firstRain.substring(0,10)===tomorrow?'明日':firstRain.substring(5,10).replace('-','/');
  put('rain-note',label+ ' '+parseInt(firstRain.substring(11,13),10)+'時ごろ<br>雨の可能性');
 }else put('rain-note','今後48時間<br>まとまった雨は少なめ');
 put('last-update','更新 '+pad(now.getUTCHours())+':'+pad(now.getUTCMinutes()));
}
function fetchWeather(done){
 var xhr=new XMLHttpRequest(),finished=false;
 function finish(e,obj){if(finished)return;finished=true;done(e,obj)}
 try{
  xhr.open('GET',URL,true);xhr.timeout=18000;
  xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;if(xhr.status>=200&&xhr.status<300){try{finish(null,JSON.parse(xhr.responseText))}catch(e){finish(e,null)}}else finish(new Error('HTTP '+xhr.status),null)};
  xhr.onerror=function(){finish(new Error('network'),null)};
  xhr.ontimeout=function(){finish(new Error('timeout'),null)};
  xhr.send(null);
 }catch(e){finish(e,null)}
}
function clock(){var dt=jst(),value=pad(dt.getUTCHours())+':'+pad(dt.getUTCMinutes()),date=(dt.getUTCMonth()+1)+'月'+dt.getUTCDate()+'日（'+WEEK[dt.getUTCDay()]+'）';
 // Do not redraw the E-Ink DOM until text actually changes.
 if(el('clock').innerHTML!==value)put('clock',value);
 if(el('date').innerHTML!==date)put('date',date);
}
function fit(){
 var w=window.innerWidth||document.documentElement.clientWidth||600;
 var h=window.innerHeight||document.documentElement.clientHeight||710;
 var scale=Math.min(1.12,(w-14)/540,(h-20)/660);if(!(scale>0))scale=1;
 var box=el('viewport'),s=el('screen');
 box.style.width=Math.floor(540*scale)+'px';box.style.height=Math.floor(660*scale)+'px';
 box.style.marginLeft=Math.max(0,Math.floor((w-540*scale)/2))+'px';
 box.style.marginTop=Math.max(0,Math.floor((h-660*scale)/2))+'px';
 var leftTurn=window.location.search.indexOf('turn=left')>=0;
 var transform=leftTurn?'translate(0px,'+(660*scale)+'px) rotate(-90deg) scale('+scale+')':'translate('+(540*scale)+'px,0px) rotate(90deg) scale('+scale+')';
 s.style.webkitTransform=transform;s.style.transform=transform;
}
function demoMode(){return window.location.search.indexOf('demo=1')>=0}
function demoData(){
 var n=jst(),x={current:{temperature_2m:11,apparent_temperature:10,relative_humidity_2m:65,wind_speed_10m:2,wind_direction_10m:45,weather_code:3,is_day:1},hourly:{time:[],temperature_2m:[],precipitation_probability:[],precipitation:[],weather_code:[],is_day:[]},daily:{time:[],temperature_2m_max:[],temperature_2m_min:[],weather_code:[]}};
 for(var d=0;d<6;d++){
  var key=dayKey(addDays(n,d));x.daily.time.push(key);x.daily.temperature_2m_max.push(15+d%3);x.daily.temperature_2m_min.push(6+d%3);x.daily.weather_code.push(3);
  for(var h=0;h<24;h++){
   x.hourly.time.push(key+'T'+pad(h)+':00');x.hourly.temperature_2m.push(Math.round(9+6*Math.sin((h-5)*Math.PI/12)));
   var rainy=(d===0&&h>=17)||(d===1&&h>=2&&h<=6)||(d===3&&h>=8&&h<=19);
   x.hourly.precipitation_probability.push(rainy?60+(h%3)*10:10+(h%4)*5);
   x.hourly.precipitation.push(rainy?0.2+(h%4)*0.5:0);
   x.hourly.weather_code.push(rainy?61:(h>=8&&h<=15?1:3));x.hourly.is_day.push(h>=6&&h<17?1:0);
  }
 }
 return x;
}
function update(){if(demoMode()){try{render(demoData());put('last-update','デザイン確認用（仮データ）')}catch(e){put('last-update','デモ表示エラー')}return;}
 fetchWeather(function(err,data){if(err){put('last-update','通信エラー：再読み込みしてください');return}try{render(data)}catch(e){put('last-update','天気データを表示できません')}});
}
fit();clock();update();
setInterval(clock,10000);setInterval(update,30*60*1000);
if(window.addEventListener){window.addEventListener('resize',fit,false);window.addEventListener('focus',clock,false);window.addEventListener('pageshow',clock,false)}
el('clock').onclick=function(){clock()};
})();
</script>
</body>
</html>
