function todayAnniversary(d){return ANNIVERSARIES[pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())]||''}

var WEATHER_URL='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+
 '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m,weather_code,is_day'+
 '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day'+
 '&daily=temperature_2m_max,temperature_2m_min,weather_code'+
 '&forecast_days=7&wind_speed_unit=ms&timezone=Asia%2FTokyo';
var weather=null,weatherDate='',wakeUntil=0,previousBlack=false,WAKE_MS=2*60*1000;
function id(s){return document.getElementById(s)}
function pad(v){return v<10?'0'+v:String(v)}
function jst(){return new Date(new Date().getTime()+9*3600000)}
function ymd(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function tomorrowDate(d,n){return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+n))}
function hhmm(d){return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())}
function setText(s,v){var n=id(s);if(n)n.textContent=String(v)}
function num(n){return typeof n==='number'&&isFinite(n)?Math.round(n):'--'}
function rainNum(n){return typeof n==='number'&&isFinite(n)?Math.round(n)+'%':'--%'}
function escapeText(s){return String(s).replace(/[&<>"']/g,function(a){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]})}
function codeText(c){if(c===0)return '快晴';if(c<=2)return '晴れ';if(c===3)return 'くもり';if(c===45||c===48)return '霧';if(c>=51&&c<=67||c>=80&&c<=82)return '雨';if(c>=71&&c<=77||c>=85&&c<=86)return '雪';if(c>=95)return '雷雨';return '天気不明'}
function icon(c,isDay){
 var a='<svg class="weather-icon" viewBox="0 0 64 64" aria-hidden="true">',s='fill="none" stroke="#202124" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"';
 var cloud='<path '+s+' d="M14 48h34a10 10 0 0 0 0-20 17 17 0 0 0-31 3A9 9 0 0 0 14 48Z"/>';
 var sun='<circle '+s+' cx="32" cy="32" r="11"/><path '+s+' d="M32 4v9M32 51v9M4 32h9M51 32h9M12 12l7 7M45 45l7 7M52 12l-7 7M19 45l-7 7"/>';
 var moon='<path '+s+' d="M44 11A22 22 0 1 0 54 45 22 22 0 0 1 44 11Z"/>';
 if(c===0)return a+(isDay?sun:moon)+'</svg>';
 if(c===1||c===2)return a+'<circle '+s+' cx="22" cy="19" r="11"/><path '+s+' d="M22 2v5M4 19h5M9 6l4 4M37 5l-4 5"/>'+cloud+'</svg>';
 if(c>=51&&c<=67||c>=80&&c<=82||c>=95)return a+cloud+'<path '+s+' d="M20 54l-3 6M33 54l-3 6M46 54l-3 6"/></svg>';
 if(c>=71&&c<=77||c>=85&&c<=86)return a+cloud+'<path '+s+' d="M19 55h8m-4-4v8M35 55h8m-4-4v8"/></svg>';
 return a+cloud+'</svg>';
}

function fit(){
 var w=window.innerWidth||document.documentElement.clientWidth,wrap=id('viewport-wrap'),stage=id('stage');
 if(w<=600&&window.innerHeight>w){stage.style.cssText='';wrap.style.height='auto';return}
 var scale=w/1024;if(scale<=0)scale=1;
 stage.style.webkitTransform='scale('+scale+')';stage.style.transform='scale('+scale+')';stage.style.webkitTransformOrigin='0 0';stage.style.transformOrigin='0 0';
 wrap.style.height=Math.ceil(562*scale)+'px';
}
function isNight(){return jst().getUTCHours()<5}
function black(){return isNight()&&new Date().getTime()>=wakeUntil}
function updateNight(){
 var b=black();document.body.className=b?'night':(isNight()?'night-preview':'');
 var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',b?'#000':'#eeeeef');return b;
}
var CLOCK_MODES=['a','b','c','d'],clockIndex=0;
var CLOCK_LABELS=['デジタル（時・分）','デジタル（秒付き）','アナログ','アナログ＋デジタル'];
function setClockMode(i){
 clockIndex=((i%4)+4)%4;
 id('clock-switch').className='clock-switch mode-'+CLOCK_MODES[clockIndex];
 id('clock-switch').setAttribute('aria-label','時計表示：'+CLOCK_LABELS[clockIndex]+'。タップすると次の表示へ切り替えます');
 try{window.localStorage.setItem('fire7_clock_mode',String(clockIndex))}catch(e){}
 refreshClock(jst());
}
function refreshClock(d){
 var h=d.getUTCHours(),m=d.getUTCMinutes(),sec=d.getUTCSeconds(),hm=hhmm(d);
 setText('clock-a-time',hm);setText('clock-b-hm',hm);setText('clock-b-sec',':'+pad(sec));setText('clock-d-hm',hm);
 // Analog hands are SVG transforms; no animation library or canvas required.
 var ah=(h%12)*30+m*.5+sec/120,am=m*6+sec*.1,as=sec*6;
 var pairs=[['hour',ah],['minute',am],['second',as]];
 for(var i=0;i<pairs.length;i++){
  var c=id(pairs[i][0]+'-c'),sm=id(pairs[i][0]+'-d');
  if(c)c.setAttribute('transform','rotate('+pairs[i][1]+' 50 50)');
  if(sm)sm.setAttribute('transform','rotate('+pairs[i][1]+' 50 50)');
 }
}
function initClockMode(){
 var old=0;
 try{var v=window.localStorage.getItem('fire7_clock_mode');if(/^[0-3]$/.test(v||''))old=parseInt(v,10)}catch(e){}
 setClockMode(old);
 var el=id('clock-switch');
 el.onclick=function(){setClockMode(clockIndex+1)};
 el.onkeydown=function(e){e=e||window.event;if(e.keyCode===13||e.keyCode===32){if(e.preventDefault)e.preventDefault();setClockMode(clockIndex+1)}};
}

function xhrJSON(url,cb){
 var xhr=new XMLHttpRequest(),done=false;
 function finish(e,d){if(done)return;done=true;cb(e,d)}
 try{xhr.open('GET',url,true);xhr.timeout=16000;
  xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status>=200&&xhr.status<300){try{finish(null,JSON.parse(xhr.responseText))}catch(e){finish(e,null)}}else finish(new Error('HTTP '+xhr.status),null)}};
  xhr.onerror=function(){finish(new Error('network'),null)};xhr.ontimeout=function(){finish(new Error('timeout'),null)};xhr.send(null)
 }catch(e){finish(e,null)}
}
function at(h,key,hour){for(var i=0;i<h.time.length;i++){if(h.time[i].substring(0,10)===key&&parseInt(h.time[i].substring(11,13),10)===hour)return i}return -1}
function tinySlot(h,k,label){
 if(k<0)return '<div class="slot"><div class="slot-time">'+label+'</div><div class="slot-icon">—</div><div class="slot-temp">--℃</div><div class="slot-pop">--%</div></div>';
 return '<div class="slot"><div class="slot-time">'+label+'</div><div class="slot-icon">'+icon(h.weather_code[k],h.is_day[k]===1)+'</div><div class="slot-temp">'+num(h.temperature_2m[k])+'℃</div><div class="slot-pop">☂ '+rainNum(h.precipitation_probability[k])+'</div></div>';
}
function isWet(code){return (code>=51&&code<=67)||(code>=80&&code<=82)||code>=95}
function periodMax(h,key,start,end){
 var prob=-1,selected=-1;for(var i=0;i<h.time.length;i++){
  if(h.time[i].substring(0,10)!==key)continue;
  var hour=parseInt(h.time[i].substring(11,13),10);if(hour<start||hour>=end)continue;
  var p=h.precipitation_probability[i];if(typeof p==='number'&&p>prob)prob=p;
  if(selected<0||Math.abs(hour-(start+end)/2)<Math.abs(parseInt(h.time[selected].substring(11,13),10)-(start+end)/2))selected=i;
 }
 return prob<0?null:prob;
}
function rainOnset(h){
 var n=jst(),current=ymd(n)+'T'+pad(n.getUTCHours()),end=new Date(n.getTime()+48*3600000),last=ymd(end)+'T'+pad(end.getUTCHours());
 for(var i=0;i<h.time.length;i++){
  var t=h.time[i].substring(0,13);if(t<current||t>last)continue;
  var p=h.precipitation_probability[i],rain=h.precipitation[i],code=h.weather_code[i];
  if((typeof rain==='number'&&rain>=0.2&&typeof p==='number'&&p>=40)||(typeof p==='number'&&p>=55&&isWet(code))){
   var key=t.substring(0,10),what=key===ymd(n)?'今日':key===ymd(tomorrowDate(n,1))?'明日':key.substring(5).replace('-','/');
   var hour=parseInt(t.substring(11,13),10);
   return what+' '+hour+'時ごろから雨の可能性（'+rainNum(p)+'）';
  }
 }
 return '今後48時間は雨の可能性が比較的低め';
}
function drawWeather(data){
 if(!data||!data.current||!data.hourly||!data.daily||!data.daily.time||!data.hourly.time)throw new Error('incomplete');
 weather=data;var c=data.current,h=data.hourly,d=data.daily,now=jst(),today=ymd(now),next=ymd(tomorrowDate(now,1));weatherDate=today;
 setText('current-temp',num(c.temperature_2m));id('weather-icon').innerHTML=icon(c.weather_code,c.is_day===1);
 setText('feels',num(c.apparent_temperature)+'℃');setText('humidity',rainNum(c.relative_humidity_2m));
 var wind=typeof c.wind_speed_10m==='number'?Math.round(c.wind_speed_10m*10)/10:'--';
 var compass=['北','北東','東','南東','南','南西','西','北西'];var deg=c.wind_direction_10m,dir=typeof deg==='number'?compass[Math.round((deg%360)/45)%8]:'--';
 setText('wind',dir+' '+wind+'m/s');
 function dailyIx(key){for(var i=0;i<d.time.length;i++)if(d.time[i]===key)return i;return -1}
 var tIx=dailyIx(today),tomIx=dailyIx(next);
 setText('today-hi-lo',tIx>=0?'最低 '+num(d.temperature_2m_min[tIx])+'℃ ／ 最高 '+num(d.temperature_2m_max[tIx])+'℃':'最高・最低 気温未取得');
 if(tomIx>=0){setText('tomorrow-temp',num(d.temperature_2m_max[tomIx]));id('tomorrow-icon').innerHTML=icon(d.weather_code[tomIx],true);setText('tomorrow-hi-lo','最低 '+num(d.temperature_2m_min[tomIx])+'℃ ／ 最高 '+num(d.temperature_2m_max[tomIx])+'℃')}
 var first=Math.floor(now.getUTCHours()/3)*3,html='',count=0;
 for(var hour=first;hour<=24;hour+=3){var k=at(h,hour===24?next:today,hour===24?0:hour);html+=tinySlot(h,k,hour===24?'24時':hour+'時');count++}
 id('today-slots').innerHTML=html;
 id('today-slots').className='slot-row'+(count>5?' dense':'');
 html='';for(var v=0;v<=18;v+=6){html+=tinySlot(h,at(h,next,v),v+'時')}
 id('tomorrow-slots').innerHTML=html;
 html='';for(var offset=2;offset<=6;offset++){
  var date=tomorrowDate(now,offset),key=ymd(date),di=dailyIx(key),dayCode=di>=0?d.weather_code[di]:-1,hi=di>=0?num(d.temperature_2m_max[di]):'--',lo=di>=0?num(d.temperature_2m_min[di]):'--';
  var am=periodMax(h,key,0,12),pm=periodMax(h,key,12,24);
  html+='<div class="five-row"><div class="day-date">'+(date.getUTCMonth()+1)+'/'+date.getUTCDate()+'<br><small>（'+WEEK[date.getUTCDay()]+'）</small></div>'+
   '<div class="day-icon">'+icon(dayCode,true)+'</div><div class="day-temp">'+hi+'℃<br><span style="color:#67696c">'+lo+'℃</span></div>'+
   '<div class="day-pop"><div><span>午前</span> <b>'+rainNum(am)+'</b></div><div><span>午後</span> <b>'+rainNum(pm)+'</b></div></div></div>';
 }
 id('forecast-days').innerHTML=html;
 setText('rain-onset',rainOnset(h));
}
function weatherUpdate(){if(black())return;xhrJSON(WEATHER_URL,function(err,data){
 if(!err){try{drawWeather(data);return}catch(e){err=e}}
 if(!weather){
  setText('today-hi-lo','天気を取得できません');setText('tomorrow-hi-lo','天気を取得できません');
  setText('rain-onset','情報を取得できません（通信をご確認ください）');
  id('today-slots').innerHTML='<div class="slot">予報未取得</div>';id('tomorrow-slots').innerHTML='<div class="slot">予報未取得</div>';
  id('forecast-days').innerHTML='<div class="five-row">予報未取得</div>';
 }
 })}
function tick(){
 var n=jst();setText('date',(n.getUTCMonth()+1)+'月'+n.getUTCDate()+'日（'+WEEK[n.getUTCDay()]+'）');setText('anniversary',todayAnniversary(n));refreshClock(n);
 var b=updateNight();if(weather&&weatherDate!==ymd(n)){weather=null;weatherUpdate()}
 if(previousBlack&&!b&&!isNight())weatherUpdate();previousBlack=b;
}
function wakeNight(){if(!isNight())return;wakeUntil=new Date().getTime()+WAKE_MS;tick();weatherUpdate()}
function blackNow(){wakeUntil=0;tick()}
id('night-blank').onclick=wakeNight;id('night-close').onclick=blackNow;
id('night-blank').onkeydown=function(e){e=e||window.event;if(e.keyCode===13||e.keyCode===32){if(e.preventDefault)e.preventDefault();wakeNight()}};
initClockMode();fit();tick();weatherUpdate();
setInterval(function(){refreshClock(jst())},1000);
setInterval(tick,15000);setInterval(weatherUpdate,30*60*1000);
window.addEventListener('resize',fit,false);window.addEventListener('orientationchange',fit,false);
if(document.addEventListener)document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();fit();weatherUpdate()}},false);
})();
</script>
