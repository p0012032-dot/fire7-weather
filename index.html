<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f8f8f6">
<title>荒牧 天気と生活情報 | Fire 7</title>
<style>
/* Fire OS 5 / old Silk: ES5 + classic flexbox, no external libraries or fonts */
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#ededeb;color:#181818;-webkit-text-size-adjust:100%}
body{font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
#stage{position:absolute;left:0;top:0;width:1024px;height:520px;overflow:hidden;background:#f8f8f6;padding:9px 23px 5px}
#page{width:978px;height:506px;overflow:hidden}
.header{height:51px;border-bottom:1px solid #292929;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
.brand{font-size:20px;letter-spacing:4px;white-space:nowrap;font-weight:400}
.date{font-size:30px;white-space:nowrap;font-weight:500}
.hero{height:124px;border-bottom:1px solid #444;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.clockbox{width:50%;height:96px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding-left:8px}
.clock{font-family:Arial,sans-serif;font-size:95px;line-height:1;letter-spacing:-5px;font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
.current{width:50%;height:96px;border-left:1px solid #aaa;padding-left:23px;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center}
.tempbox{min-width:265px}.minor{font-size:16px;color:#5d5d5d;white-space:nowrap}.temp{font-family:Arial,sans-serif;font-size:65px;line-height:1.08;font-weight:300;white-space:nowrap}.temp small{font-size:31px;vertical-align:8px;margin-left:3px}.feels{font-size:15px;color:#555;white-space:nowrap}
.condition{width:120px;text-align:center;font-size:16px;white-space:nowrap}.condition svg{width:61px;height:61px;display:block;margin:0 auto -1px}
.section{display:-webkit-flex;display:flex;border-bottom:1px solid #333;-webkit-align-items:center;align-items:center}
.hours{height:92px}.days{height:110px}.heading{width:162px;flex-shrink:0;-webkit-flex-shrink:0;font-size:19px;font-weight:400;white-space:nowrap;padding-left:6px}
.slots{width:816px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.hour{width:25%;height:73px;border-left:1px solid #c4c4c4;text-align:center}.hour:first-child{border-left:0}
.hour-time{font-size:16px;line-height:18px}.hour-mid{height:37px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}.hour-mid svg{width:35px;height:35px;margin-right:10px}.hour-num{font-size:27px}.prob{font-size:14px;color:#575757;line-height:17px;white-space:nowrap}
.day{width:20%;height:97px;border-left:1px solid #c4c4c4;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;align-items:center;text-align:center}
.day:first-child{border-left:0}.day-title{font-size:17px;line-height:20px;white-space:nowrap}.day svg{width:31px;height:32px;display:block;margin:1px auto}.day-temps{font-size:18px;line-height:21px;white-space:nowrap}.day-prob{font-size:14px;color:#5b5b5b;line-height:20px;white-space:nowrap}
.tiles{height:78px;border-bottom:1px solid #333;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.tile{height:58px;min-width:0;border:1px solid #c0c0c0;border-radius:4px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:7px 12px;margin-right:10px;text-decoration:none;color:inherit}
.tile:last-child{margin-right:0}.tile-one{width:30%}.tile-two{width:32%}.tile-three{width:38%}
.tile-label{font-size:14px;color:#5c5c5c;line-height:1.35;white-space:nowrap}.tile-value{font-size:19px;font-weight:600;text-align:right;max-width:68%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile-three .tile-value{font-size:16px}
.news{height:36px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;text-decoration:none;color:inherit}
.news-label{font-size:17px;font-weight:600;white-space:nowrap;margin-right:15px}.news-text{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4b4b4b;display:block;min-width:0;-webkit-flex:1;flex:1}
.news-source{font-size:12px;margin-left:10px;color:#666;white-space:nowrap}
.footer{height:15px;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;color:#666;font-size:10px;padding-top:1px;white-space:nowrap}
a{color:inherit}
svg.weather-icon{overflow:visible}
.night{background:#000!important}.night #stage{display:none}.night #night-blank{display:block}
#night-blank{display:none;background:#000;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;cursor:pointer}
#night-close{display:none;position:fixed;right:14px;bottom:12px;z-index:9999;background:#202020;color:#fff;border:1px solid #777;border-radius:5px;padding:8px 13px;font-size:13px;font-family:inherit;cursor:pointer}
.night-preview #night-close{display:block}
@media (max-width:600px) and (orientation:portrait){
 html,body{height:auto;overflow:auto;background:#f8f8f6}
 #stage{position:relative!important;left:auto!important;top:auto!important;transform:none!important;-webkit-transform:none!important;width:100%;height:auto;min-height:100vh;padding:14px 13px;overflow:visible}
 #page{width:100%;height:auto;overflow:visible}
 .header{height:52px}.brand{font-size:12px;letter-spacing:2px}.date{font-size:20px}
 .hero{height:auto;display:block;padding:16px 2px}.clockbox{width:100%;height:85px;padding-left:0}.clock{font-size:82px}
 .current{width:100%;height:122px;border-left:0;border-top:1px solid #bbb;padding:13px 0 0}.tempbox{min-width:0}.temp{font-size:70px}.condition{width:100px}
 .section{display:block;padding:12px 0}.hours,.days{height:auto}.heading{width:100%;padding:0 0 10px;font-size:17px}.slots{width:100%}.hour{height:82px}.hour-mid svg{width:24px;height:27px;margin-right:4px}.hour-num{font-size:21px}.hour-time{font-size:13px}.prob{font-size:11px}
 .day{height:100px}.day-title{font-size:13px}.day-temps{font-size:12px}.day-prob{font-size:10px}
 .tiles{height:auto;display:block;padding:9px 0}.tile{width:100%;height:50px;margin:0 0 7px}.news{height:auto;min-height:50px;padding:5px 0}.news-label{font-size:13px;margin-right:8px}.news-text{font-size:13px}.news-source{display:none}.footer{height:auto;font-size:9px;white-space:normal;line-height:1.5}
}
</style>
</head>
<body>
<div id="stage"><div id="page">
  <div class="header"><div class="brand">ARAMAKI / WEATHER</div><div class="date" id="date">--月--日（-）</div></div>
  <div class="hero">
    <div class="clockbox"><div class="clock" id="clock">--:--</div></div>
    <div class="current">
      <div class="tempbox"><div class="minor">現在の気温</div><div class="temp"><span id="current-temp">--</span><small>°C</small></div><div class="feels" id="feels">体感 --° ・ 最高 --° / 最低 --°</div></div>
      <div class="condition"><span id="weather-icon"></span><span id="weather-label">取得中</span></div>
    </div>
  </div>
  <div class="section hours"><div class="heading">時間別の天気</div><div class="slots" id="hours"> <div class="hour">取得中...</div></div></div>
  <div class="section days"><div class="heading">5日間の予報</div><div class="slots" id="days"><div class="day">取得中...</div></div></div>
  <div class="tiles">
    <div class="tile tile-one"><div class="tile-label">傘の目安<br>今後6時間</div><div class="tile-value" id="umbrella">判定中</div></div>
    <a class="tile tile-two" id="garbage-link" href="https://www.city.itami.lg.jp/SOSIKI/SHIMIN/KANKYOC/h28cal/tikupdf/1453869112924.html" target="_blank" rel="noopener"><div class="tile-label">明日のゴミ<br>荒牧・A2地区</div><div class="tile-value" id="garbage">確認中</div></a>
    <a class="tile tile-three" id="alert-link" href="https://www.jma.go.jp/bosai/warning/" target="_blank" rel="noopener"><div class="tile-label">気象警報<br>注意報</div><div class="tile-value" id="alert">公式情報を確認</div></a>
  </div>
  <a class="news" id="news-link" href="https://news.web.nhk/" target="_blank" rel="noopener"><span class="news-label">主要ニュース</span><span class="news-text" id="news-title">ニュースは取得設定後に表示します（タップでNHKニュースへ）</span><span class="news-source" id="news-source">NHKニュース</span></a>
  <div class="footer"><span id="status">天気情報を取得中...</span><span>天気：Open-Meteo（モデル推定） / ゴミ：伊丹市公式 / 警報：気象庁を確認</span></div>
</div></div>
<div id="night-blank" role="button" tabindex="0" aria-label="タップで天気を2分間表示"></div>
<button type="button" id="night-close">黒画面に戻す</button>
<script>
(function(){
'use strict';
var LAT=34.8107, LON=135.3825, WEEK=['日','月','火','水','木','金','土'];
var RANGE_START='2026-11-22', RANGE_END='2027-03-31';
var WEATHER_URL='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+
 '&current=temperature_2m,apparent_temperature,weather_code,is_day'+
 '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day'+
 '&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max'+
 '&forecast_days=6&timezone=Asia%2FTokyo';
var lastWeather=null, lastWeatherDate='', latestUpdate=0, items=[], itemPos=0;
var nightAwakeUntil=0, previousBlack=false, WAKE_MS=2*60*1000;
function id(s){return document.getElementById(s)}
function pad(n){return n<10?'0'+n:String(n)}
function jst(){return new Date(new Date().getTime()+9*3600000)}
function fmtDate(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function fmtHour(d){return fmtDate(d)+'T'+pad(d.getUTCHours())}
function datePlus(d,n){return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+n))}
function put(el,s){id(el).textContent=String(s)}
function number(n){return typeof n==='number' && isFinite(n)?String(Math.round(n)):'--'}
function weatherLabel(c){
 if(c===0)return '快晴'; if(c===1||c===2)return '晴れ';if(c===3)return 'くもり';
 if(c===45||c===48)return '霧';if(c>=51&&c<=67||c>=80&&c<=82)return '雨';
 if(c>=71&&c<=77||c>=85&&c<=86)return '雪';if(c>=95)return '雷雨';return '天気不明';
}
function weatherIcon(c,isDay){
 var a='<svg class="weather-icon" viewBox="0 0 64 64" aria-hidden="true">',s='fill="none" stroke="#181818" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"';
 var cloud='<path '+s+' d="M15 48h33a11 11 0 0 0-1-22 17 17 0 0 0-31 4A10 10 0 0 0 15 48Z"/>';
 var sun='<circle '+s+' cx="32" cy="32" r="11"/><path '+s+' d="M32 5v10M32 49v10M5 32h10M49 32h10M13 13l7 7M44 44l7 7M51 13l-7 7M20 44l-7 7"/>';
 var moon='<path '+s+' d="M42 9A22 22 0 1 0 55 44 22 22 0 0 1 42 9Z"/>';
 if(c===0)return a+(isDay?sun:moon)+'</svg>';
 if(c===1||c===2)return a+'<circle '+s+' cx="20" cy="18" r="10"/>'+cloud+'</svg>';
 if(c>=51&&c<=67||c>=80&&c<=82||c>=95)return a+cloud+'<path '+s+' d="M20 53l-3 7M34 53l-3 7M48 53l-3 7"/></svg>';
 if(c>=71&&c<=77||c>=85&&c<=86)return a+cloud+'<path '+s+' d="M19 56h8m-4-4v8M35 56h8m-4-4v8"/></svg>';
 return a+cloud+'</svg>';
}
function scale(){
 if(window.innerWidth<=600 && window.innerHeight>window.innerWidth){id('stage').style.cssText='';return;}
 var w=window.innerWidth||document.documentElement.clientWidth;
 var h=window.innerHeight||document.documentElement.clientHeight;
 // Keep the complete 1024 x 520 canvas visible even with Silk toolbar open.
 var sc=Math.min((w-4)/1024,(h-4)/520);
 if(sc<=0)sc=1;
 var x=Math.max(0,Math.floor((w-1024*sc)/2));
 var y=Math.max(0,Math.floor((h-520*sc)/2));
 var t='translate('+x+'px,'+y+'px) scale('+sc+')';
 id('stage').style.webkitTransform=t;id('stage').style.transform=t;
 id('stage').style.webkitTransformOrigin='0 0';id('stage').style.transformOrigin='0 0';
}
function garbageTomorrow(){
 var day=datePlus(jst(),1), key=fmtDate(day),wd=day.getUTCDay(),r='';
 if(key<RANGE_START||key>RANGE_END){r='日程要確認';}
 else if(key==='2027-01-01'||key==='2026-12-31'||key==='2027-01-02'||key==='2027-01-03')r='収集なし';
 else if(wd===1)r='資源物';
 else if(wd===2)r='燃やすごみ';
 else if(wd===3)r='不燃・プラ';
 else if(wd===5)r='可燃・びん／ペット';
 else r='収集なし';
 put('garbage',r);
 // Calendar is validated for Nov 2026–Mar 2027. Other dates require city verification.
}
function isNight(d){return d.getUTCHours()<5;}
function isBlack(){return isNight(jst()) && new Date().getTime()>=nightAwakeUntil;}
function setNightDisplay(){
 var night=isNight(jst());
 var black=night && new Date().getTime()>=nightAwakeUntil;
 document.body.className=black?'night':(night?'night-preview':'');
 var theme=document.querySelector('meta[name="theme-color"]');
 if(theme)theme.setAttribute('content',black?'#000000':'#f8f8f6');
 return black;
}
function tick(){
 var d=jst();put('clock',pad(d.getUTCHours())+':'+pad(d.getUTCMinutes()));
 put('date',(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日（'+WEEK[d.getUTCDay()]+'）');
 var black=setNightDisplay();
 garbageTomorrow();
 if(lastWeather&&lastWeatherDate!==fmtDate(d))render(lastWeather);
 // At 05:00 immediately refresh data instead of showing an old forecast.
 if(previousBlack&&!black&&!isNight(d)){weatherUpdate();otherUpdate();}
 previousBlack=black;
}
function wakeNight(){
 if(!isNight(jst()))return;
 nightAwakeUntil=new Date().getTime()+WAKE_MS;
 tick();scale();weatherUpdate();otherUpdate();
}
function blackNow(){nightAwakeUntil=0;tick();}

function render(data){
 if(!data||!data.current||!data.hourly||!data.daily||!data.daily.time)throw new Error('API data missing');
 lastWeather=data;lastWeatherDate=fmtDate(jst());
 var cur=data.current,h=data.hourly,d=data.daily, now=jst();
 put('current-temp',number(cur.temperature_2m));put('weather-label',weatherLabel(cur.weather_code));
 id('weather-icon').innerHTML=weatherIcon(cur.weather_code,cur.is_day===1);
 put('feels','体感 '+number(cur.apparent_temperature)+'° ・ 最高 '+number(d.temperature_2m_max[0])+'° / 最低 '+number(d.temperature_2m_min[0])+'°');
 var nowKey=fmtHour(now),i,index=-1;
 // Pick first upcoming 3-hourly forecast. At midnight the next day remains valid.
 var target=datePlus(now,0);
 target.setUTCHours(Math.ceil((now.getUTCHours()+(now.getUTCMinutes()>0?0.0001:0))/3)*3,0,0,0);
 if(target.getTime()<now.getTime())target=new Date(target.getTime()+3*3600000);
 var wanted=fmtHour(target);
 for(i=0;i<h.time.length;i++){if(h.time[i].substring(0,13)>=wanted){index=i;break;}}
 var hours='';
 if(index>=0){for(i=0;i<4;i++){
  var p=index+3*i;if(p>=h.time.length)break;
  var hour=h.time[p].substring(11,13)+':00';
  hours+='<div class="hour"><div class="hour-time">'+hour+'</div><div class="hour-mid">'+weatherIcon(h.weather_code[p],h.is_day[p]===1)+'<span class="hour-num">'+number(h.temperature_2m[p])+'°</span></div><div class="prob">降水 '+number(h.precipitation_probability[p])+'%</div></div>';
 }}
 id('hours').innerHTML=hours||'<div class="hour">未取得</div>';
 var days='';
 for(i=1;i<=5;i++){
  if(i>=d.time.length)break;
  var parts=d.time[i].split('-'),dt=new Date(Date.UTC(Number(parts[0]),Number(parts[1])-1,Number(parts[2])));
  days+='<div class="day"><div class="day-title">'+WEEK[dt.getUTCDay()]+' '+dt.getUTCDate()+'</div>'+weatherIcon(d.weather_code[i],true)+
   '<div class="day-temps">'+number(d.temperature_2m_max[i])+'° / '+number(d.temperature_2m_min[i])+'°</div><div class="day-prob">降水 '+number(d.precipitation_probability_max[i])+'%</div></div>';
 }
 id('days').innerHTML=days||'<div class="day">未取得</div>';
 var maxProb=-1, rain=0;
 for(i=0;i<h.time.length;i++){
  if(h.time[i]<fmtHour(now)||h.time[i]>fmtHour(new Date(now.getTime()+6*3600000)))continue;
  if(typeof h.precipitation_probability[i]==='number')maxProb=Math.max(maxProb,h.precipitation_probability[i]);
  if(typeof h.precipitation[i]==='number')rain+=h.precipitation[i];
 }
 var umbrella='判定不可';
 if(maxProb>=50||rain>=0.5)umbrella='傘を持って';
 else if(maxProb>=25||rain>0)umbrella='あると安心';
 else if(maxProb>=0)umbrella='不要そう';
 put('umbrella',umbrella);
 latestUpdate=new Date().getTime();
 put('status','天気：'+pad(now.getUTCHours())+':'+pad(now.getUTCMinutes())+'更新 ・ 30分ごと');
}
function request(url,done){
 var xhr=new XMLHttpRequest();xhr.open('GET',url,true);xhr.timeout=16000;
 xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status>=200&&xhr.status<300){try{done(null,JSON.parse(xhr.responseText));}catch(e){done(e,null);}}else done(new Error('HTTP '+xhr.status),null);}};
 xhr.onerror=function(){done(new Error('network'),null)};
 xhr.ontimeout=function(){done(new Error('timeout'),null)};
 try{xhr.send(null);}catch(e){done(e,null);}
}
function weatherUpdate(){
 // Avoid network polling during the black-screen hours unless manually woken.
 if(isBlack())return;
 request(WEATHER_URL,function(err,data){
  if(!err){try{render(data);return;}catch(e){err=e;}}
  put('status',lastWeather?'天気更新失敗：前回取得値を表示':'天気を取得できません（Wi-Fi・日時を確認）');
  if(!lastWeather){put('weather-label','未取得');put('umbrella','判定不可');}
 });
}
function otherUpdate(){
 if(isBlack())return;
 // Optional: future automation may publish info.json in the same repository.
 // No fictitious alert clearance or news headlines when the feed is absent.
 request('info.json?t='+Math.floor(new Date().getTime()/1800000),function(err,data){
  if(err||!data)return;
  if(data.updated_at){var stamp=Date.parse(data.updated_at);if(!isFinite(stamp)||new Date().getTime()-stamp>2*3600000)return;}
  if(data.alert&&typeof data.alert.text==='string'){
    put('alert',data.alert.text.substring(0,24));
    if(data.alert.url&&/^https:\/\//.test(data.alert.url))id('alert-link').href=data.alert.url;
  }
  if(data.news && data.news.length){
   items=[];for(var i=0;i<data.news.length;i++){
    var q=data.news[i];if(q&&typeof q.title==='string'&&typeof q.url==='string'&&/^https:\/\//.test(q.url))items.push(q);
   }
   itemPos=0;newsSlide();
  }
 });
}
function newsSlide(){
 if(!items.length)return;
 var it=items[itemPos%items.length];itemPos++;
 put('news-title',it.title);put('news-source',it.source||'ニュース');id('news-link').href=it.url;
}
function onWake(){tick();weatherUpdate();otherUpdate();scale()}
id('night-blank').onclick=wakeNight;
id('night-blank').onkeydown=function(e){e=e||window.event;if(e.keyCode===13||e.keyCode===32){if(e.preventDefault)e.preventDefault();wakeNight();}};
id('night-close').onclick=blackNow;
scale();tick();weatherUpdate();otherUpdate();
setInterval(tick,15000);setInterval(weatherUpdate,30*60*1000);
setInterval(otherUpdate,30*60*1000);setInterval(newsSlide,20000);
window.addEventListener('resize',scale,false);window.addEventListener('orientationchange',scale,false);
if(document.addEventListener)document.addEventListener('visibilitychange',function(){if(!document.hidden)onWake()},false);
})();
</script>
</body>
</html>
