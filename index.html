<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#f8f8f6">
  <title>荒牧の天気 | Fire 7</title>
  <style>
    /* Fire 7 (7th generation) friendly: no framework, external fonts, or build step */
    html, body { margin:0; padding:0; min-height:100%; background:#f8f8f6; color:#151515; }
    body { font-family: Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; -webkit-text-size-adjust:100%; }
    * { box-sizing:border-box; }
    .dashboard { max-width:1200px; margin:0 auto; padding:19px 26px 12px; }
    .top { border-bottom:1px solid #202020; padding-bottom:11px; display:-webkit-flex; display:flex; -webkit-justify-content:space-between; justify-content:space-between; -webkit-align-items:center; align-items:center; }
    .brand { font-size:19px; letter-spacing:0.27em; font-weight:400; white-space:nowrap; }
    .date { font-size:21px; letter-spacing:0.045em; white-space:nowrap; }
    .hero { display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; padding:20px 0 19px; min-height:214px; border-bottom:1px solid #202020; }
    .clock-area { width:52%; padding:0 22px 0 4px; }
    .clock { font-family:Arial, sans-serif; font-size:126px; font-weight:300; line-height:1; letter-spacing:-0.07em; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .clock-label { margin:9px 0 0 8px; color:#555; font-size:16px; }
    .current { width:48%; min-height:170px; padding-left:30px; border-left:1px solid #333; }
    .eyebrow { font-size:19px; letter-spacing:.08em; margin:0 0 4px; }
    .temp-line { display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:space-between; justify-content:space-between; min-height:113px; }
    .temperature { font-family:Arial,sans-serif; font-size:112px; font-weight:300; letter-spacing:-.075em; line-height:1; white-space:nowrap; }
    .temperature .unit { font-size:.43em; vertical-align:27px; margin-left:4px; letter-spacing:-.04em; }
    .current-condition { width:122px; text-align:center; flex-shrink:0; -webkit-flex-shrink:0; }
    .current-condition svg { width:83px; height:70px; display:block; margin:0 auto 4px; }
    .condition-label { font-size:17px; white-space:nowrap; }
    .current-detail { color:#5a5a5a; font-size:14px; }
    .section { border-bottom:1px solid #222; display:-webkit-flex; display:flex; padding:20px 0; }
    .section-heading { width:21%; -webkit-flex-shrink:0; flex-shrink:0; margin:0; font-size:20px; font-weight:500; letter-spacing:.02em; line-height:1.3; }
    .forecast-content { width:79%; display:-webkit-flex; display:flex; }
    .hour { width:25%; border-left:1px solid #bbb; text-align:center; padding:1px 9px; }
    .hour:first-child { border-left:0; }
    .hour-time { font-size:21px; letter-spacing:.02em; margin-bottom:12px; }
    .hour-main { display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center; gap:6px; }
    .hour-main svg { width:53px; height:52px; margin-right:10px; }
    .hour-temp { font-size:34px; font-weight:300; white-space:nowrap; }
    .rain { color:#555; font-size:15px; margin-top:8px; }
    .daily-section { padding:18px 0 14px; border-bottom:none; }
    .day { width:33.333%; border-left:1px solid #bbb; display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center; padding:2px 8px; }
    .day:first-child { border-left:0; }
    .day-name { font-size:23px; margin-right:14px; }
    .day svg { width:45px; height:45px; margin-right:13px; }
    .day-temp { font-size:22px; white-space:nowrap; }
    .footer { color:#777; font-size:11px; display:-webkit-flex; display:flex; -webkit-justify-content:space-between; justify-content:space-between; padding-top:4px; gap:10px; }
    .footer a { color:inherit; }
    svg { overflow:visible; }
    .night { background:#000 !important; color:#000 !important; }
    .night .dashboard { visibility:hidden; }
    .night-note { display:none; }
    .night .night-note { display:block; position:absolute; left:0; top:0; width:100%; height:100%; background:#000; }
    @media (max-width:850px) {
      .dashboard { padding:16px 19px 10px; }
      .brand { font-size:15px; letter-spacing:.2em; }
      .date { font-size:17px; }
      .hero { min-height:170px; padding:14px 0; }
      .clock { font-size:93px; }
      .current { min-height:135px; padding-left:18px; }
      .eyebrow { font-size:16px; }
      .temperature { font-size:86px; }
      .temperature .unit { vertical-align:20px; }
      .current-condition { width:95px; }
      .current-condition svg { width:65px; height:57px; }
      .condition-label { font-size:14px; }
      .section-heading { font-size:17px; }
      .hour-time { font-size:17px; }
      .hour-main svg { width:39px; height:40px; margin-right:5px; }
      .hour-temp { font-size:26px; }
      .day-name, .day-temp { font-size:17px; }
      .day svg { width:32px; height:34px; margin-right:6px; }
    }
    @media (max-width:610px) {
      .dashboard { padding:15px; }
      .top { display:block; }
      .brand { font-size:15px; }
      .date { font-size:15px; margin-top:5px; }
      .hero { display:block; }
      .clock-area, .current { width:100%; padding:0; border:0; }
      .clock { font-size:82px; }
      .current { border-top:1px solid #bbb; margin-top:14px; padding-top:12px; }
      .section { display:block; }
      .section-heading { width:100%; margin-bottom:12px; }
      .forecast-content { width:100%; }
      .hour { padding:0 3px; }
      .hour-time { font-size:14px; }
      .hour-main { display:block; }
      .hour-main svg { display:block; margin:0 auto 4px; }
      .hour-temp { font-size:22px; }
      .rain { font-size:12px; }
      .day { display:block; text-align:center; }
      .day-name { margin:0; }
      .day svg { display:block; margin:5px auto; }
      .day-temp { font-size:14px; }
      .footer { display:block; line-height:1.8; }
    }
  </style>
</head>
<body>
<div class="dashboard" id="dashboard">
  <div class="top"><span class="brand">ARAMAKI / WEATHER</span><span class="date" id="date">--月--日</span></div>
  <div class="hero">
    <div class="clock-area"><div class="clock" id="clock">--:--</div><div class="clock-label">現在時刻</div></div>
    <div class="current">
      <div class="eyebrow">現在の気温</div>
      <div class="temp-line">
        <div class="temperature"><span id="current-temp">--</span><span class="unit">°C</span></div>
        <div class="current-condition"><span id="current-icon"></span><div class="condition-label" id="current-weather">取得中</div></div>
      </div>
      <div class="current-detail" id="today-range">兵庫県伊丹市荒牧</div>
    </div>
  </div>
  <div class="section">
    <h2 class="section-heading">時間別の天気</h2>
    <div class="forecast-content" id="hours">
      <div class="hour">取得中...</div>
    </div>
  </div>
  <div class="section daily-section">
    <h2 class="section-heading">3日間の予報</h2>
    <div class="forecast-content" id="days"><div class="day">取得中...</div></div>
  </div>
  <div class="footer">
    <span id="status">天気データを取得しています</span>
    <span>出典：<a href="https://open-meteo.com/" target="_blank">Open-Meteo.com</a>（気象モデルによる推定・予報）</span>
  </div>
</div>
<div class="night-note" aria-hidden="true"></div>
<script>
(function () {
  'use strict';
  // Aramaki neighborhood approximate central coordinates (not a device GPS reading).
  var LATITUDE = 34.8107;
  var LONGITUDE = 135.3825;
  var REFRESH_MS = 30 * 60 * 1000;
  var apiUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + LATITUDE +
    '&longitude=' + LONGITUDE +
    '&current=temperature_2m,weather_code,is_day' +
    '&hourly=temperature_2m,precipitation_probability,weather_code,is_day' +
    '&daily=temperature_2m_max,temperature_2m_min,weather_code' +
    '&forecast_days=5&timezone=Asia%2FTokyo';
  var lastData = null;
  var weekdays = ['日', '月', '火', '水', '木', '金', '土'];
  function el(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function nowJst() {
    // Explicit JST so the display works even if device time zone was changed.
    var d = new Date();
    return new Date(d.getTime() + (9 * 60 + d.getTimezoneOffset()) * 60000);
  }
  function updateClock() {
    var d = nowJst();
    el('clock').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes());
    el('date').innerHTML = (d.getMonth() + 1) + '月' + d.getDate() + '日（' + weekdays[d.getDay()] + '）';
    // Nighttime black overlay is NOT physical display-off.
    var night = d.getHours() >= 22 || d.getHours() < 6;
    document.body.className = night ? 'night' : '';
  }
  function label(code) {
    if (code === 0) { return '快晴'; }
    if (code <= 2) { return '晴れ時々くもり'; }
    if (code === 3) { return 'くもり'; }
    if (code === 45 || code === 48) { return '霧'; }
    if (code >= 51 && code <= 67) { return '雨'; }
    if (code >= 71 && code <= 77) { return '雪'; }
    if (code >= 80 && code <= 82) { return 'にわか雨'; }
    if (code >= 85 && code <= 86) { return 'にわか雪'; }
    if (code >= 95) { return '雷雨'; }
    return '天気不明';
  }
  function icon(code, day) {
    var strokes = 'fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"';
    var start = '<svg viewBox="0 0 64 64" role="img" aria-label="' + label(code) + '">';
    var cloud = '<path ' + strokes + ' d="M16 48H47A12 12 0 0 0 47 24A17 17 0 0 0 15 29A10 10 0 0 0 16 48Z"/>';
    var sun = '<circle ' + strokes + ' cx="32" cy="32" r="11"/><path ' + strokes + ' d="M32 5V13 M32 51V59 M5 32H13 M51 32H59 M13 13L19 19 M45 45L51 51 M51 13L45 19 M19 45L13 51"/>';
    var moon = '<path ' + strokes + ' d="M42 9A23 23 0 1 0 55 44A23 23 0 0 1 42 9Z"/>';
    var rain = '<path ' + strokes + ' d="M22 53L19 60 M34 53L31 60 M46 53L43 60"/>';
    var snow = '<path ' + strokes + ' d="M20 56h8 M24 52v8 M35 56h8 M39 52v8"/>';
    if (code === 0) { return start + (day ? sun : moon) + '</svg>'; }
    if (code <= 2) { return start + '<circle ' + strokes + ' cx="22" cy="19" r="10"/>' + cloud + '</svg>'; }
    if (code >= 51 && code <= 67 || code >= 80 && code <= 82 || code >= 95) { return start + cloud + rain + '</svg>'; }
    if (code >= 71 && code <= 77 || code >= 85 && code <= 86) { return start + cloud + snow + '</svg>'; }
    return start + cloud + '</svg>';
  }
  function niceNum(value) {
    return typeof value === 'number' ? String(Math.round(value)) : '--';
  }
  function getHourForToday(iso) {
    // API returns dates in Asia/Tokyo as YYYY-MM-DDTHH:mm; lexical comparison is safe.
    return iso.substring(0, 13);
  }
  function render(data) {
    if (!data || !data.current || !data.hourly || !data.daily) { throw new Error('incomplete data'); }
    lastData = data;
    var c = data.current;
    el('current-temp').innerHTML = niceNum(c.temperature_2m);
    el('current-weather').innerHTML = label(c.weather_code);
    el('current-icon').innerHTML = icon(c.weather_code, c.is_day === 1);
    if (data.daily.temperature_2m_max && data.daily.temperature_2m_max.length) {
      el('today-range').innerHTML = '最高 ' + niceNum(data.daily.temperature_2m_max[0]) + '° / 最低 ' + niceNum(data.daily.temperature_2m_min[0]) + '°';
    }
    var h = data.hourly, arr = h.time || [], dateNow = nowJst();
    var currentIso = dateNow.getFullYear() + '-' + pad(dateNow.getMonth() + 1) + '-' + pad(dateNow.getDate()) + 'T' + pad(dateNow.getHours());
    var idx = 0, i;
    // First next 3-hour interval (09, 12, 15, 18...)
    var baseHour = Math.ceil(dateNow.getHours() / 3) * 3;
    var start = new Date(dateNow.getFullYear(),dateNow.getMonth(),dateNow.getDate(),baseHour,0,0,0);
    if (start.getTime() < dateNow.getTime()) { start = new Date(start.getTime() + 3*3600000); }
    var wanted = start.getFullYear() + '-' + pad(start.getMonth()+1) + '-' + pad(start.getDate()) + 'T' + pad(start.getHours());
    for (i = 0; i < arr.length; i++) { if (getHourForToday(arr[i]) >= wanted) { idx = i; break; } }
    var hourHtml = '';
    for (i = 0; i < 4 && idx + i*3 < arr.length; i++) {
      var p = idx + i*3, hour = parseInt(arr[p].substring(11, 13),10), day = h.is_day && h.is_day[p] === 1;
      hourHtml += '<div class="hour"><div class="hour-time">' + pad(hour) + ':00</div>' +
        '<div class="hour-main">' + icon(h.weather_code[p], day) + '<span class="hour-temp">' + niceNum(h.temperature_2m[p]) + '°</span></div>' +
        '<div class="rain">降水 ' + niceNum(h.precipitation_probability[p]) + '%</div></div>';
    }
    el('hours').innerHTML = hourHtml || '時間別予報を取得できません';
    var dailyHtml = '', today = nowJst();
    for (i = 1; i < 4 && i < data.daily.time.length; i++) {
      var dayParts = data.daily.time[i].split('-');
      var dd = new Date(Number(dayParts[0]),Number(dayParts[1])-1,Number(dayParts[2]));
      dailyHtml += '<div class="day"><span class="day-name">' + weekdays[dd.getDay()] + '</span>' + icon(data.daily.weather_code[i], true) +
        '<span class="day-temp">' + niceNum(data.daily.temperature_2m_max[i]) + '° / ' + niceNum(data.daily.temperature_2m_min[i]) + '°</span></div>';
    }
    el('days').innerHTML = dailyHtml || '週間予報を取得できません';
    var t = nowJst();
    el('status').innerHTML = '30分ごとに更新 ・ 最終取得 ' + pad(t.getHours()) + ':' + pad(t.getMinutes());
  }
  function loadWeather() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', apiUrl, true);
    xhr.timeout = 20000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { render(JSON.parse(xhr.responseText)); return; } catch(e) {}
        }
        el('status').innerHTML = lastData ? '天気更新に失敗しました（前回取得値を表示）' : '天気を取得できません。Wi-Fi・日時設定をご確認ください';
        if (!lastData) { el('current-weather').innerHTML = '取得失敗'; }
      }
    };
    xhr.onerror = function() { el('status').innerHTML = '通信に失敗しました。Wi-Fi・日時設定をご確認ください'; };
    xhr.ontimeout = function() { el('status').innerHTML = '天気の取得がタイムアウトしました'; };
    try { xhr.send(null); } catch (e) { el('status').innerHTML = '天気を取得できません'; }
  }
  updateClock();
  loadWeather();
  setInterval(updateClock, 15000);
  setInterval(loadWeather, REFRESH_MS);
  // Resuming the tablet often resumes a suspended tab, refresh when visible.
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { updateClock(); loadWeather(); } }, false);
  }
}());
</script>
</body>
</html>
